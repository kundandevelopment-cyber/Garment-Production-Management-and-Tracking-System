
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page_title }}</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #1f2937;
        }

        .container {
            max-width: 650px;
            margin: 30px auto;
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 10px rgba(0,0,0,.06);
        }

        h1 { margin-top: 0; }

        .field { margin-bottom: 18px; }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
        }

        .help, .errorlist {
            font-size: 13px;
            color: #6b7280;
        }

        .errorlist { color: #b91c1c; }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 24px;
        }

        .btn {
            display: inline-block;
            padding: 11px 16px;
            border: 0;
            border-radius: 7px;
            text-decoration: none;
            cursor: pointer;
            font-size: 14px;
        }

        .primary {
            background: #2563eb;
            color: white;
        }

        .secondary {
            background: #e5e7eb;
            color: #111827;
        }

        @media (max-width: 600px) {
            body { padding: 12px; }
            .container { margin: 10px auto; padding: 18px; }
            .actions .btn { width: 100%; text-align: center; }
        }
    </style>
</head>

<body>
<div class="container">
    <h1>{{ page_title }}</h1>

    <form method="post">
        {% csrf_token %}

        {% for field in form %}
            <div class="field">
                <label for="{{ field.id_for_label }}">
                    {{ field.label }}
                </label>

                {{ field }}

                {% if field.help_text %}
                    <div class="help">{{ field.help_text|safe }}</div>
                {% endif %}

                {% for error in field.errors %}
                    <div class="errorlist">{{ error }}</div>
                {% endfor %}
            </div>
        {% endfor %}

        {% if form.non_field_errors %}
            <div class="errorlist">
                {{ form.non_field_errors }}
            </div>
        {% endif %}

        <div class="actions">
            <button class="btn primary" type="submit">
                {{ submit_label }}
            </button>

            <a class="btn secondary" href="{% url 'accounts:user_list' %}">
                Cancel
            </a>
        </div>
    </form>
</div>
</body>
</html>
