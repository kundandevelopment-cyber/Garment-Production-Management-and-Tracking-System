
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Garment Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 35px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .login-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .login-header h1 {
            margin: 0 0 8px;
            font-size: 25px;
            color: #1e293b;
        }

        .login-header p {
            margin: 0;
            color: #64748b;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #334155;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px 13px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .login-button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .login-button:hover {
            background: #1d4ed8;
        }

        .error-message {
            margin-bottom: 18px;
            padding: 12px;
            border-radius: 7px;
            background: #fee2e2;
            color: #b91c1c;
            font-size: 14px;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="login-header">
        <h1>Garment Management</h1>
        <p>Sign in to your account</p>
    </div>

    {% if form.errors %}
        <div class="error-message">
            Invalid username or password. Please try again.
        </div>
    {% endif %}

    {% if next %}
        <div class="error-message">
            Please log in to access this page.
        </div>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <div class="form-group">
            <label for="id_username">Username</label>
            <input
                type="text"
                name="username"
                id="id_username"
                placeholder="Enter your username"
                required
                autofocus
            >
        </div>

        <div class="form-group">
            <label for="id_password">Password</label>
            <input
                type="password"
                name="password"
                id="id_password"
                placeholder="Enter your password"
                required
            >
        </div>

        <button type="submit" class="login-button">
            Sign In
        </button>
    </form>

</div>

</body>
</html>
